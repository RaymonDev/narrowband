<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
<title id="t">G2 send time versus LZ4 bytes</title>
<desc id="d">Median updateImageRawData time on G2 glasses for 16 tile variants measured by g2-kit, against the LZ4 size of the same tiles packed as Gray4. A line of 177 ms plus 162 ms per KB fits with R² 0.94.</desc>

  <style>
    svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
          --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
            --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
    }
    .bg { fill: var(--surface); }
    .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
    .sub { fill: var(--ink2); font-size: 12px; }
    .panel { fill: var(--ink); font-size: 13px; font-weight: 600; }
    .tick { fill: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
    .label { fill: var(--ink2); font-size: 11px; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1; }
    .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { stroke: var(--surface); stroke-width: 2; }
  </style>
<rect class="bg" width="640" height="400"/>
<text class="title" x="16" y="26">On G2 hardware, send time follows the LZ4 size of packed Gray4</text>
<text class="sub" x="16" y="46">16 tile variants timed by g2-kit (median of 30 sends each) vs. our LZ4 size of the same tiles.</text>
<text class="sub" x="16" y="62">Fit: 177 ms + 162 ms/KB (≈ 6.2 KB/s effective), R² 0.94, leave-one-out error 39 ms.</text>
<line class="grid" x1="64" x2="610" y1="344" y2="344"/>
<text class="tick" x="56" y="347.5" text-anchor="end">0 ms</text>
<line class="grid" x1="64" x2="610" y1="306" y2="306"/>
<text class="tick" x="56" y="309.5" text-anchor="end">100 ms</text>
<line class="grid" x1="64" x2="610" y1="268" y2="268"/>
<text class="tick" x="56" y="271.5" text-anchor="end">200 ms</text>
<line class="grid" x1="64" x2="610" y1="230" y2="230"/>
<text class="tick" x="56" y="233.5" text-anchor="end">300 ms</text>
<line class="grid" x1="64" x2="610" y1="192" y2="192"/>
<text class="tick" x="56" y="195.5" text-anchor="end">400 ms</text>
<line class="grid" x1="64" x2="610" y1="154" y2="154"/>
<text class="tick" x="56" y="157.5" text-anchor="end">500 ms</text>
<line class="grid" x1="64" x2="610" y1="116" y2="116"/>
<text class="tick" x="56" y="119.5" text-anchor="end">600 ms</text>
<line class="grid" x1="64" x2="610" y1="78" y2="78"/>
<text class="tick" x="56" y="81.5" text-anchor="end">700 ms</text>
<line class="axis" x1="64" x2="610" y1="344" y2="344"/>
<text class="tick" x="64" y="360" text-anchor="middle">0</text>
<text class="tick" x="155" y="360" text-anchor="middle">500</text>
<text class="tick" x="246" y="360" text-anchor="middle">1,000</text>
<text class="tick" x="337" y="360" text-anchor="middle">1,500</text>
<text class="tick" x="428" y="360" text-anchor="middle">2,000</text>
<text class="tick" x="519" y="360" text-anchor="middle">2,500</text>
<text class="tick" x="610" y="360" text-anchor="middle">3,000</text>
<text class="label" x="610" y="378" text-anchor="end">LZ4 bytes per send (packed Gray4, LZ4_compress_default)</text>
<line x1="64" y1="276.71692249596293" x2="610" y2="92.47873385748088" stroke="var(--s1)" stroke-width="2" stroke-opacity="0.45"/>
