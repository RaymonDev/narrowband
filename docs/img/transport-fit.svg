<text class="label" x="98.043" y="256.86" text-anchor="end">blank tile</text>
<text class="label" x="288.78" y="202.9" text-anchor="end">counter</text>
<text class="label" x="430.266" y="141.66" text-anchor="start">dense cross-hatch</text>
<text class="label" x="548.207" y="115.78" text-anchor="end">outline bar chart</text>
<text class="label" x="125.23400000000001" y="284.86" text-anchor="start">72×72 tile</text>
<text class="tick" x="16" y="390">Timings: github.com/RAZKOM/g2-kit STATUS.md (H1b, H1c). Tiles re-rendered from its hub-bench code; data/g2kit-bench.</text>
</svg>